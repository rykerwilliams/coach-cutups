# cargo-about: the crate licence notices shipped in the .deb, generated by
# `packaging/build-deb.sh` from Cargo.lock at package time (never committed,
# so it can't drift from the lock file).
#
# `accepted` is also a tripwire. A crate whose licence expression can't be
# satisfied from this list fails the package build. That is the point: a
# GPL-2.0-*only* crate can't be combined with this AGPL-3.0 program, so it
# must never be accepted, and anything else new gets a human look before it
# ships. List order is priority: where a crate offers a choice, the first
# listed licence is the one recorded.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    # Slint, taken under its GPL option (the others are Slint's own
    # licences). AGPL-3.0 section 13 permits the combination.
    "GPL-3.0-only",
    # Coach Cuts' own crates.
    "AGPL-3.0-or-later",
]
targets = ["x86_64-unknown-linux-gnu"]
# Notices for what the binary contains: build scripts and proc-macro hosts
# don't ship.
ignore-build-dependencies = true
ignore-dev-dependencies = true
