name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Enforces the core-isolation invariant: video-coach-core must build and
  # test on a machine with NO GStreamer installed. If a media dependency is
  # ever added to that crate, this job fails to build. See the spec's
  # "Core isolation" section -- this is the enforcement, not a lint.
  core:
    name: core (no GStreamer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p video-coach-core --verbose

  # Compiles Slint and GStreamer, so this is the job where the MSRV pin
  # (workspace rust-version) checks something. No test may open a window.
  workspace:
    name: workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `gstreamer1.0-libav` is there for `avenc_aac`, which is rank none and
      # has no alternative; it also brings `avdec_h264` (rank 256), which
      # outranks `openh264dec` and so moves this runner closer to the dev
      # machine. `tests/openh264.rs` keeps openh264 covered by rank.
      - name: Install GStreamer and UI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gl \
            gstreamer1.0-plugins-ugly gstreamer1.0-plugins-bad gstreamer1.0-libav \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libegl-dev libgl-dev
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Advisory only. Per the spec: a red Windows build does not veto a
  # dependency that is right for Linux. Windows is not a release target
  # until Phase 11, and video-coach-media would need GStreamer dev
  # libraries on the runner to typecheck at all, so only core is checked.
  windows:
    name: windows (advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p video-coach-core
