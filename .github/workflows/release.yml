name: release

# Builds the .deb, proves it, and publishes it to a GitHub Release.
#
# A tag `v<version>` runs everything and publishes. A manual dispatch runs the
# same pipeline for real and publishes nothing (the .deb is still kept as a
# workflow artifact), which is how the pipeline is checked without cutting a
# release. The release process is in CLAUDE.md.
#
# Separate from rust.yml because a tags trigger there would rerun every job
# on each tag.
#
# No Swatinem/rust-cache, in any job, deliberately. On a key miss it restores
# the prefix key and keeps dependency build dirs younger than a week, and
# cargo does not rerun whisper-rs-sys's build script when .cargo/config.toml's
# [env] changes, so a cache could ship a whisper.cpp built with the wrong
# instruction set. Releases are rare; they build cold.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # rust.yml's `workspace` job, repeated so that nothing is published from a
  # commit that fails it. Keep the two in step.
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
        with:
          components: clippy, rustfmt
      # One source of truth for the version: the workspace's, which is the
      # one the .deb carries. First, so a mistyped tag fails in seconds.
      - name: Check the tag matches the workspace version
        if: github.event_name == 'push'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "video-coach-app") | .version')
          if [[ $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (expected v$version)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches the workspace version"
      - name: Install GStreamer and UI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gl \
            gstreamer1.0-plugins-ugly gstreamer1.0-plugins-bad gstreamer1.0-libav \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libegl-dev libgl-dev \
            cmake libclang-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  package:
    name: package
    needs: test
    # The exact target distro: the binary needs GLIBC_2.39, so building on
    # anything newer would raise its libc floor above Ubuntu 24.04's.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The workspace job's list, plus dpkg-dev: cargo-deb's `$auto` Depends
      # is dpkg-shlibdeps, and without it cargo-deb only warns.
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gl \
            gstreamer1.0-plugins-ugly gstreamer1.0-plugins-bad gstreamer1.0-libav \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libegl-dev libgl-dev \
            cmake libclang-dev \
            dpkg-dev
      - uses: dtolnay/rust-toolchain@1.92
      # Without `--features cli`, cargo-about installs no binary.
      - name: Install cargo-deb and cargo-about
        run: |
          cargo install --locked cargo-deb@3.8.0
          cargo install --locked cargo-about@0.9.2 --features cli
      - name: Build the .deb
        run: packaging/build-deb.sh
      # After packaging, so it checks the build that was packaged. A
      # `-march=native` whisper.cpp dies with SIGILL on a CPU older than the
      # runner's; one without `-mavx2` is scalar and unusably slow.
      - name: Assert whisper.cpp's instruction set
        run: |
          mapfile -t outputs < <(find target -path '*whisper-rs-sys-*' -name output)
          if ((${#outputs[@]} == 0)); then
            echo "::error::no whisper-rs-sys build output under target/"
            exit 1
          fi
          status=0
          for output in "${outputs[@]}"; do
            grep -m1 'CPU backend variant' "$output" || true
            if ! grep -q -- '-mavx2' "$output"; then
              echo "::error::$output: whisper.cpp built without -mavx2"
              status=1
            fi
            if grep -q -- '-march=native' "$output"; then
              echo "::error::$output: whisper.cpp built with -march=native"
              status=1
            fi
          done
          exit $status
      - name: Smoke-test the .deb in a clean ubuntu:24.04
        run: packaging/smoke-test.sh target/debian/coach-cuts_*_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/coach-cuts_*_amd64.deb
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" coach-cuts_*_amd64.deb \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Coach Cuts $GITHUB_REF_NAME" --generate-notes
