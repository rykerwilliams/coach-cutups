name: release

# Builds the .deb, proves it, and publishes it to a GitHub Release.
#
# A tag `v<version>` runs everything and publishes. A manual dispatch runs the
# same pipeline for real and publishes nothing (the .deb is still kept as a
# workflow artifact), which is how the pipeline is checked without cutting a
# release. The release process is in CLAUDE.md.
#
# Separate from rust.yml because a tags trigger there would rerun every job
# on each tag; it gates on rust.yml instead, by calling it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # rust.yml, whole, so that nothing is published from a commit that fails it.
  test:
    name: test
    uses: ./.github/workflows/rust.yml

  # One source of truth for the version: the workspace's, which is the one
  # the .deb carries. Its own job, beside `test`, so a mistyped tag fails in
  # seconds rather than after the tests.
  version:
    name: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - name: Check the tag matches the workspace version
        # The ref, not the event: a dispatch from a branch has no tag to
        # compare, and passes.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "video-coach-app") | .version')
          if [[ $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (expected v$version)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches the workspace version"

  package:
    name: package
    needs: [test, version]
    # The exact target distro: the binary needs GLIBC_2.39, so building on
    # anything newer would raise its libc floor above Ubuntu 24.04's.
    runs-on: ubuntu-24.04
    # No Swatinem/rust-cache here, deliberately: this job builds the binary
    # that ships. On a key miss the cache restores the prefix key and keeps
    # dependency build dirs younger than a week, and cargo does not rerun
    # whisper-rs-sys's build script when .cargo/config.toml's [env] changes,
    # so a cache could ship a whisper.cpp built for the wrong instruction set.
    # Releases are rare; this builds cold.
    steps:
      - uses: actions/checkout@v4
      # The one list, commented there: packaging/build-deps.txt.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            $(grep -o '^[^#]*' packaging/build-deps.txt)
      - uses: dtolnay/rust-toolchain@1.92
      # Without `--features cli`, cargo-about installs no binary.
      - name: Install cargo-deb and cargo-about
        run: |
          cargo install --locked cargo-deb@3.8.0
          cargo install --locked cargo-about@0.9.2 --features cli
      # Also asserts whisper.cpp's instruction set: the check lives in the
      # script, so it guards every build of the .deb, not only this one.
      - name: Build the .deb
        run: packaging/build-deb.sh
      - name: Smoke-test the .deb in a clean ubuntu:24.04
        run: packaging/smoke-test.sh target/debian/coach-cuts_*_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/coach-cuts_*_amd64.deb
          if-no-files-found: error

  release:
    name: release
    needs: package
    # Both halves, deliberately. The event alone would publish on any branch
    # push, were a branch trigger ever added; the ref alone would publish a
    # workflow_dispatch run started from a tag. Only a pushed tag releases.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" coach-cuts_*_amd64.deb \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Coach Cuts $GITHUB_REF_NAME" --generate-notes
