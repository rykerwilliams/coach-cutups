[package]
name = "video-coach-app"
description = "Break down game film with recorded commentary and drawings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The binary is named for the application ID (`coach-cuts`, also the config
# directory and the desktop entry); the package keeps its crate name.
[[bin]]
name = "coach-cuts"
path = "src/main.rs"

# The library (the bus) uses none of the UI dependencies, so it builds and
# tests without a display. Slint, the EGL wrapping and `rfd` are for the
# binary (`src/main.rs`, `src/video.rs`, `src/pickers.rs`), which Cargo can't
# give dependencies of its own.
[dependencies]
video-coach-core = { path = "../video-coach-core" }
video-coach-media = { path = "../video-coach-media" }
gstreamer.workspace = true
gstreamer-gl.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
slint = { workspace = true, features = ["raw-window-handle-06"] }
rfd.workspace = true
gstreamer-gl-egl.workspace = true
glutin_egl_sys.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The .deb (Phase 11 spec S2, S6). Build it with `packaging/build-deb.sh`, not
# bare `cargo deb`: the script first generates the crate licence notices this
# list ships. Asset paths are relative to this crate; `target/release/` is
# cargo-deb's placeholder for the real target directory.
[package.metadata.deb]
# Without these three, cargo-deb names the package after the crate, emits no
# Maintainer field (dpkg then warns on every later apt command), and
# describes it as "[generated from Rust crate video-coach-app]".
name = "coach-cuts"
maintainer = "Rajah James <rajahjames@gmail.com>"
extended-description = """\
Coach Cuts is for breaking down game film. Record commentary over the \
game video with a webcam and microphone, draw on the picture as it plays, \
and export each clip as a video with the commentary, the drawings and a \
picture-in-picture of the coach burned in. Commentary can be transcribed on \
the device; the speech model downloads once, on first use."""
section = "video"
# A native package: its version is the workspace version, with no Debian
# revision, so the file is coach-cuts_<version>_amd64.deb and matches the tag.
revision = ""
# `$auto` is dpkg-shlibdeps reading the binary's linked libraries (it needs
# `dpkg-dev` on the build machine). The rest link nothing, so it can't see
# them:
# - the GStreamer plugin packages: every element the code names is in one;
# - libxcursor1, libxi6, libxkbcommon-x11-0: winit dlopens them on X11, and
#   without them the app doesn't start;
# - libgstreamer1.0-0 (>= 1.24): 1.24 is what's tested, though `$auto` derives
#   only >= 1.20. The two constraints on one package are legal; apt takes both.
depends = "$auto, gstreamer1.0-plugins-base, gstreamer1.0-plugins-good, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, gstreamer1.0-gl, gstreamer1.0-pipewire, libxcursor1, libxi6, libxkbcommon-x11-0, libgstreamer1.0-0 (>= 1.24)"
# The Intel VA driver for hardware decode (without one, export falls back to
# software encoding), and zenity, which the file dialogs fall back to when the
# desktop portal is missing.
recommends = "intel-media-va-driver | va-driver-all, zenity"
license-file = ["../../packaging/copyright", "0"]
assets = [
    ["target/release/coach-cuts", "usr/bin/", "755"],
    ["../../packaging/coach-cuts.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/16x16/coach-cuts.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["../../packaging/icons/32x32/coach-cuts.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["../../packaging/icons/64x64/coach-cuts.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["../../packaging/icons/128x128/coach-cuts.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../packaging/icons/256x256/coach-cuts.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../packaging/icons/512x512/coach-cuts.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    # Generated by `packaging/build-deb.sh` (cargo-about).
    ["target/release/crate-licenses.txt", "usr/share/doc/coach-cuts/", "644"],
]
